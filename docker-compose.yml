services:
  hunters:
    image: ghcr.io/newedensoft/hunters-server:${HUNTERS_TAG:-latest}
    build: .
    restart: unless-stopped
    environment:
      Hunters__Name: ${HUNTERS_NAME:-Hunters}
      Hunters__Web__Enabled: ${HUNTERS_WEB_ENABLED:-true}
      Hunters__Admission__AccessKey__Enabled: ${HUNTERS_ACCESS_KEY_ENABLED:-false}
      Hunters__Admins__0: ${HUNTERS_ADMIN_CHARACTER_ID:-}
      Hunters__Sso__ClientId: ${EVE_CLIENT_ID:?EVE_CLIENT_ID must be set}
      Hunters__Sso__ClientSecret: ${EVE_CLIENT_SECRET:?EVE_CLIENT_SECRET must be set}
      Hunters__Sso__CallbackUrl: ${HUNTERS_PUBLIC_URL:?HUNTERS_PUBLIC_URL must be set}/auth/eve/callback
      ConnectionStrings__hunters: Host=db;Database=hunters;Username=hunters;Password=${DB_PASSWORD:?DB_PASSWORD must be set}
      # Set to true when running behind a reverse proxy (Caddy, Traefik, nginx).
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: ${HUNTERS_BEHIND_PROXY:-false}
    volumes:
      - dpkeys:/app/keys # Data Protection keys: must persist, or stored tokens become unreadable
      - sde:/app/sde # SDE cache for the map: optional, avoids a 100 MB download on every restart
    ports:
      - "${HUNTERS_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

  # Collects public activity data (ESI hourly kills and jumps) into the database's intel schema,
  # which the server reads. No ports: it only talks to ESI and the database.
  intel:
    image: ghcr.io/newedensoft/hunters-intel:${HUNTERS_TAG:-latest}
    build:
      context: .
      target: intel
    restart: unless-stopped
    environment:
      ConnectionStrings__hunters: Host=db;Database=hunters;Username=hunters;Password=${DB_PASSWORD:?DB_PASSWORD must be set}
      Hunters__Esi__Contact: ${HUNTERS_PUBLIC_URL:?HUNTERS_PUBLIC_URL must be set}
    volumes:
      - intel-sde:/app/sde # Its own SDE cache: the server's could be mid-download at the same moment
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: hunters
      POSTGRES_USER: hunters
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hunters -d hunters"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dpkeys:
  sde:
  intel-sde:
  pgdata:
